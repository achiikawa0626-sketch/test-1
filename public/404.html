<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AskGrandma</title>
    <script>
      (function () {
        var location = window.location;
        var parts = location.pathname.split('/').filter(Boolean);
        var repo = parts.length > 0 ? '/' + parts[0] : '';

        if (!repo) {
          location.replace(location.origin + '/');
          return;
        }

        if (location.pathname.indexOf(repo + '/') !== 0 && location.pathname !== repo) {
          location.replace(location.origin + repo + '/');
          return;
        }

        var route = location.pathname.slice(repo.length).replace(/^\//, '');
        var query = location.search ? '&' + location.search.slice(1) : '';
        location.replace(location.origin + repo + '/?/' + route + query + location.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
