<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AskGrandma</title>
    <script>
      (function () {
        var location = window.location;
        var repo = '/test-1';

        if (location.pathname === repo || location.pathname === repo + '/') {
          location.replace(location.origin + repo + '/#/');
          return;
        }

        if (location.pathname.indexOf(repo + '/') !== 0) {
          var rootRoute = location.pathname.replace(/^\//, '');
          location.replace(location.origin + repo + '/#/' + rootRoute + location.search);
          return;
        }

        var route = location.pathname.slice(repo.length).replace(/^\//, '');
        var query = location.search || '';
        location.replace(location.origin + repo + '/#/' + route + query);
      })();
    </script>
  </head>
  <body></body>
</html>
