<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var location = window.location;
        if (location.search.indexOf('?/') !== 0) return;

        var parts = location.search.slice(2).split('&');
        var route = parts.shift() || '';
        var query = parts.length ? '?' + parts.join('&') : '';
        var basePath = location.pathname.replace(/\/$/, '');

        window.history.replaceState(null, '', basePath + '/' + route + query + location.hash);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AskGrandma helps families save questions, answers, and memories in one private story space."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%grandma-favicon.svg" />
    <title>AskGrandma</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
